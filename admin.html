<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin - PrintHub</title>
  <style>
    *{margin:0;padding:0;box-sizing:border-box;font-family:Arial}
    body{background:#0a0a0a;color:#fff}
    header{display:flex;justify-content:space-between;align-items:center;padding:18px 30px;background:#0f0f0f;border-bottom:1px solid #1e1e1e;position:sticky;top:0;z-index:10}
    .logo{font-weight:900;display:flex;gap:10px;align-items:center}
    .logo-icon{width:32px;height:32px;background:#f9c23c;border-radius:8px;display:grid;place-items:center;color:#000}
    #logoutBtn{background:#f9c23c;color:#000;border:none;padding:9px 16px;border-radius:9px;font-weight:900;cursor:pointer}
    .wrap{max-width:1200px;margin:0 auto;padding:20px}
    .stats{display:flex;gap:14px;flex-wrap:wrap;margin:20px 0}
    .stat{background:#151515;border:1px solid #222;border-radius:14px;padding:18px;width:200px}
    .stat h4{font-size:11px;color:#888} .stat h2{font-size:22px;color:#f9c23c}
    .tabs{display:flex;gap:8px;margin:20px 0}
    .tab{padding:8px 14px;border-radius:20px;border:1px solid #222;background:#151515;color:#aaa;font-size:11px;cursor:pointer;font-weight:800}
    .tab.active{background:#f9c23c;color:#000}
    table{width:100%;border-collapse:collapse;background:#121212;border-radius:14px;overflow:hidden}
    th,td{padding:12px 10px;text-align:left;font-size:12px;border-bottom:1px solid #1e1e1e;vertical-align:middle}
    th{color:#f9c23c;font-size:11px;background:#0f0f0f}
    .status{padding:4px 8px;border-radius:20px;font-size:10px;font-weight:900;text-transform:capitalize}
    .pending,.paid{background:#2a2210;color:#f9c23c} .completed{background:#0f2a1a;color:#4ade80}
    .actionBtn{padding:6px 10px;border:none;border-radius:6px;font-weight:900;font-size:10px;cursor:pointer;margin-right:4px}
    .approve{background:#f9c23c;color:#000} .reject{background:#222;color:#fff}
    .viewBtn{background:#222;color:#f9c23c;border:1px solid #f9c23c} .deleteBtn{background:#3a1111;color:#ff5a5a;border:1px solid #ff5a5a}
    #imageModal{display:none;position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,0.95);z-index:9999;align-items:center;justify-content:center;flex-direction:column;padding:20px}
    #imageModal img{max-width:90%;max-height:70vh;border-radius:12px;border:3px solid #f9c23c;object-fit:contain;background:#111;min-width:300px;min-height:200px}
  </style>
</head>
<body>
<header><div class="logo"><div class="logo-icon">🖨️</div>PrintHub Admin</div><button id="logoutBtn">Logout</button></header>
<div class="wrap">
  <h2>Overview</h2><p style="color:#666;font-size:12px">Welcome back, here is your shop performance</p>
  <div class="stats">
    <div class="stat"><h4>TOTAL ORDERS</h4><h2 id="totalOrders">0</h2></div>
    <div class="stat"><h4>TOTAL REVENUE</h4><h2 id="totalRev">₱0</h2></div>
    <div class="stat"><h4>PENDING</h4><h2 id="pendingCount">0</h2></div>
    <div class="stat"><h4>COMPLETED</h4><h2 id="completedCount">0</h2></div>
  </div>
  <div class="tabs">
    <div class="tab active" onclick="filterBy('all',this)">All</div>
    <div class="tab" onclick="filterBy('today',this)">Today</div>
    <div class="tab" onclick="filterBy('yesterday',this)">Yesterday</div>
    <div class="tab" onclick="filterBy('week',this)">Last 7 Days</div>
  </div>
  <table><thead><tr><th>CUSTOMER</th><th>FILE</th><th>TYPE</th><th>PAYMENT</th><th>AMOUNT</th><th>STATUS</th><th>ACTION</th></tr></thead><tbody id="orderTable"></tbody></table>
</div>

<div id="imageModal">
  <span onclick="closeImageModal()" style="position:absolute;top:20px;right:30px;color:white;font-size:45px;cursor:pointer">&times;</span>
  <img id="modalImage" src="" onerror="this.src=''; document.getElementById('modalDebug').textContent='Error loading image. File may have been deleted or path is wrong. Check Storage > print-files'"><p id="modalFileName" style="color:white;margin-top:15px;font-size:13px;word-break:break-all"></p>
  <p id="modalDebug" style="color:#888;font-size:11px;margin-top:8px"></p>
  <div style="display:flex;gap:10px;margin-top:12px">
    <a id="modalDownload" href="" download target="_blank" style="background:#f9c23c;color:black;padding:10px 20px;border-radius:8px;text-decoration:none;font-weight:900">Download / Print</a>
    <button onclick="closeImageModal()" style="background:#222;color:white;border:1px solid #444;padding:10px 20px;border-radius:8px;font-weight:900;cursor:pointer">Close</button>
  </div>
</div>

<script type="module">
import { supabase } from './supabase.js';
const ADMIN_EMAIL="Johnreysumingit53@gmail.com";
const {data:{session}}=await supabase.auth.getSession();
if(!session)location.href='login.html';
else if(session.user.email.toLowerCase()!==ADMIN_EMAIL.toLowerCase()){alert("You are not admin!");location.href='index.html';}
document.getElementById('logoutBtn').onclick=async()=>{await supabase.auth.signOut();location.href='index.html';}

let allOrders=[];
async function loadOrders(){
  const {data,error}=await supabase.from('orders').select('*').order('created_at',{ascending:false});
  console.log("Orders data:",data);
  allOrders=data||[]; renderOrders(allOrders); updateStats(allOrders);
}
function updateStats(orders){
  let rev=0,pend=0,comp=0;
  orders.forEach(o=>{rev+=Number(o.amount||0);if(o.status!=='completed')pend++;else comp++;});
  document.getElementById('totalOrders').textContent=orders.length;
  document.getElementById('totalRev').textContent='₱'+rev;
  document.getElementById('pendingCount').textContent=pend;
  document.getElementById('completedCount').textContent=comp;
}
function renderOrders(orders){
  const tbody=document.getElementById('orderTable'); tbody.innerHTML='';
  if(orders.length===0){tbody.innerHTML='<tr><td colspan=7 style="text-align:center;padding:40px;color:#666">No orders yet</td></tr>';return;}
  orders.forEach(o=>{
    const tr=document.createElement('tr');
    
    const safeFileName = (o.file_name||'').replace(/'/g, "\\'");
    const safeFileUrl = (o.file_url||'').replace(/'/g, "\\'");
    tr.innerHTML=`
      <td>${o.customer_email}</td>
      <td><div style="display:flex;align-items:center;gap:6px"><button class="actionBtn viewBtn" onclick="viewImage('${safeFileName}','${safeFileUrl}')">View</button><span style="color:#f9c23c;max-width:130px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;display:inline-block" title="${o.file_name}">${o.file_name}</span></div></td>
      <td>${o.print_type}</td><td>${o.payment_method}</td><td>₱${o.amount}</td>
      <td><span class="status ${o.status}">${o.status}</span></td>
      <td>
        <button class="actionBtn approve" onclick="updateStatus('${o.id}','completed')">Complete</button>
        <button class="actionBtn reject" onclick="updateStatus('${o.id}','pending')">Pending</button>
        <button class="actionBtn deleteBtn" onclick="deleteOrder('${o.id}')">Delete</button>
      </td>`;
    tbody.appendChild(tr);
  });
}
window.filterBy=(type,el)=>{document.querySelectorAll('.tab').forEach(t=>t.classList.remove('active'));el.classList.add('active');if(type==='all'){renderOrders(allOrders);return;}const now=new Date();let f=allOrders.filter(o=>{const d=new Date(o.created_at);if(type==='today')return d.toDateString()===now.toDateString();if(type==='yesterday'){const y=new Date();y.setDate(now.getDate()-1);return d.toDateString()===y.toDateString();}if(type==='week'){const w=new Date();w.setDate(now.getDate()-7);return d>=w;}});renderOrders(f);}
window.updateStatus=async(id,s)=>{await supabase.from('orders').update({status:s}).eq('id',id);loadOrders();}
window.deleteOrder=async(id)=>{
  if(!confirm("Are you sure you want to delete this order? This cannot be undone.")) return;
  await supabase.from('orders').delete().eq('id',id);
  alert("Order deleted!");
  loadOrders();
}
window.viewImage=async(fileName, fileUrl)=>{
  document.getElementById('imageModal').style.display='flex';
  document.getElementById('modalImage').src='';
  document.getElementById('modalFileName').textContent=fileName;
  document.getElementById('modalDebug').textContent='Loading image...';
  
  let publicUrl = null;

  if(fileUrl && fileUrl.startsWith('http')){
    publicUrl = fileUrl;
  }
  
  else if(fileUrl && !fileUrl.startsWith('http')){
    const {data} = supabase.storage.from('print-files').getPublicUrl(fileUrl);
    if(data?.publicUrl) publicUrl = data.publicUrl;
  }
  
  if(!publicUrl || publicUrl.includes('null')){
    const {data} = supabase.storage.from('print-files').getPublicUrl(fileName);
    publicUrl = data.publicUrl;
  }

  if(!publicUrl){
     const {data} = await supabase.storage.from('print-files').createSignedUrl(fileName, 3600);
     if(data?.signedUrl) publicUrl = data.signedUrl;
  }

  console.log("Final URL:", publicUrl);
  document.getElementById('modalImage').src=publicUrl;
  document.getElementById('modalDownload').href=publicUrl;
  document.getElementById('modalDebug').textContent=publicUrl;
};
window.closeImageModal=()=>{document.getElementById('imageModal').style.display='none';};
loadOrders();
</script>
</body>
</html>
