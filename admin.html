<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Admin - PrintHub</title>
<style>*{margin:0;padding:0;box-sizing:border-box;font-family:Arial}body{background:#0a0a0a;color:#fff}header{display:flex;justify-content:space-between;align-items:center;padding:18px 30px;background:#0f0f0f;border-bottom:1px solid #1e1e1e;position:sticky;top:0}.logo{font-weight:900;display:flex;gap:10px;align-items:center}.logo-icon{width:32px;height:32px;background:#f9c23c;border-radius:8px;display:grid;place-items:center;color:#000}#logoutBtn{background:#f9c23c;color:#000;border:none;padding:9px 16px;border-radius:9px;font-weight:900;cursor:pointer}.wrap{max-width:1100px;margin:0 auto;padding:20px}.stats{display:flex;gap:14px;flex-wrap:wrap;margin:20px 0}.stat{background:#151515;border:1px solid #222;border-radius:14px;padding:18px;width:200px}.stat h4{font-size:11px;color:#888}.stat h2{font-size:22px;color:#f9c23c}.tabs{display:flex;gap:8px;margin:20px 0}.tab{padding:8px 14px;border-radius:20px;border:1px solid #222;background:#151515;color:#aaa;font-size:11px;cursor:pointer;font-weight:800}.tab.active{background:#f9c23c;color:#000}table{width:100%;border-collapse:collapse;background:#121212;border-radius:14px;overflow:hidden}th,td{padding:12px 10px;text-align:left;font-size:12px;border-bottom:1px solid #1e1e1e}th{color:#f9c23c;font-size:11px;background:#0f0f0f}.status{padding:4px 8px;border-radius:20px;font-size:10px;font-weight:900}.pending{background:#2a2210;color:#f9c23c}.completed{background:#0f2a1a;color:#4ade80}.empty{text-align:center;padding:60px;color:#666}.actionBtn{padding:6px 10px;border:none;border-radius:6px;font-weight:900;font-size:10px;cursor:pointer;margin-right:4px}.approve{background:#f9c23c;color:#000}.reject{background:#222;color:#fff}</style>
</head><body><header><div class="logo"><div class="logo-icon">🖨️</div>PrintHub Admin</div><button id="logoutBtn">Logout</button></header>
<div class="wrap"><h2>Overview</h2><p style="color:#666;font-size:12px">Welcome back Johnrey, here is your shop performance</p>
<div class="stats"><div class="stat"><h4>TOTAL ORDERS</h4><h2 id="totalOrders">0</h2></div><div class="stat"><h4>TOTAL REVENUE</h4><h2 id="totalRev">₱0</h2></div><div class="stat"><h4>PENDING</h4><h2 id="pendingCount">0</h2></div><div class="stat"><h4>COMPLETED</h4><h2 id="completedCount">0</h2></div></div>
<div style="display:flex;justify-content:space-between;align-items:center;margin-top:20px"><h3>Recent Orders</h3></div>
<div class="tabs"><div class="tab active" onclick="filterBy('all',this)">All</div><div class="tab" onclick="filterBy('today',this)">Today</div><div class="tab" onclick="filterBy('yesterday',this)">Yesterday</div><div class="tab" onclick="filterBy('week',this)">Last 7 Days</div></div>
<table><thead><tr><th>CUSTOMER</th><th>FILE</th><th>TYPE</th><th>PAYMENT</th><th>AMOUNT</th><th>STATUS</th><th>ACTION</th></tr></thead><tbody id="orderTable"></tbody></table>
<div id="emptyState" class="empty" style="display:none"><div style="font-size:40px">📭</div><h4>No orders yet</h4><p style="font-size:11px">Wala pang nag order for this period</p></div></div>
<script type="module">
import { supabase } from './supabase.js';
const ADMIN_EMAIL="Johnreysumingit53@gmail.com";
const {data:{session}}=await supabase.auth.getSession();
if(!session)location.href='login.html';
else if(session.user.email.toLowerCase()!==ADMIN_EMAIL.toLowerCase()){alert("Hindi ka admin!");location.href='index.html';}
document.getElementById('logoutBtn').onclick=async()=>{await supabase.auth.signOut();location.href='index.html';}
let allOrders=[];
async function loadOrders(){const {data}=await supabase.from('orders').select('*').order('created_at',{ascending:false});allOrders=data||[];renderOrders(allOrders);updateStats(allOrders);}
function updateStats(orders){let rev=0,pend=0,comp=0;orders.forEach(o=>{rev+=Number(o.amount||0);if(o.status==='pending')pend++;if(o.status==='completed')comp++;});document.getElementById('totalOrders').textContent=orders.length;document.getElementById('totalRev').textContent='₱'+rev;document.getElementById('pendingCount').textContent=pend;document.getElementById('completedCount').textContent=comp;}
function renderOrders(orders){const tbody=document.getElementById('orderTable'),empty=document.getElementById('emptyState');tbody.innerHTML='';if(orders.length===0){empty.style.display='block';return;}empty.style.display='none';orders.forEach(o=>{const tr=document.createElement('tr');tr.innerHTML=`<td>${o.customer_email}</td><td><a href="${o.file_url}" target="_blank" style="color:#f9c23c">${o.file_name}</a></td><td>${o.print_type}</td><td>${o.payment_method}</td><td>₱${o.amount}</td><td><span class="status ${o.status}">${o.status}</span></td><td><button class="actionBtn approve" onclick="updateStatus('${o.id}','completed')">Complete</button><button class="actionBtn reject" onclick="updateStatus('${o.id}','pending')">Pending</button></td>`;tbody.appendChild(tr);});}
window.filterBy=(type,el)=>{document.querySelectorAll('.tab').forEach(t=>t.classList.remove('active'));el.classList.add('active');if(type==='all'){renderOrders(allOrders);return;}const now=new Date();let f=allOrders.filter(o=>{const d=new Date(o.created_at);if(type==='today')return d.toDateString()===now.toDateString();if(type==='yesterday'){const y=new Date();y.setDate(now.getDate()-1);return d.toDateString()===y.toDateString();}if(type==='week'){const w=new Date();w.setDate(now.getDate()-7);return d>=w;}});renderOrders(f);}
window.updateStatus=async(id,s)=>{await supabase.from('orders').update({status:s}).eq('id',id);loadOrders();}
loadOrders();
</script></body></html>
